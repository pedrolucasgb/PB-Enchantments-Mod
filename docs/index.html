<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PB Enchantments — skill trees for Minecraft</title>
<meta name="description" content="PB Enchantments: progressive quality-of-life skill trees for every tool. A Fabric mod for Minecraft 26.2.">
<style>
  :root {
    --bg: #0f1210;
    --panel: #171c18;
    --panel-2: #1d241f;
    --border: #2b352d;
    --text: #e8efe9;
    --muted: #9db2a1;
    --accent: #7dd87d;
    --accent-dark: #4caf50;
    --gold: #e5c065;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  header {
    position: relative;
    padding: 72px 0 48px;
    text-align: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(125, 216, 125, 0.10), transparent),
      var(--bg);
    border-bottom: 1px solid var(--border);
  }

  /* Corner gadgets: language pills on the left, GitHub stars on the right. */
  .lang-picker {
    position: absolute;
    top: 16px;
    left: 20px;
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .lang-picker button {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 10px;
    cursor: pointer;
  }
  .lang-picker button + button { border-left: 1px solid var(--border); }
  .lang-picker button.on { background: var(--accent-dark); color: #0c130c; }

  .gh-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 5px 10px;
  }
  .gh-btn:hover { border-color: var(--accent-dark); }
  .gh-btn svg { fill: var(--text); }
  .gh-count {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing: -0.02em;
  }
  h1 .pb { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 1.15rem; margin: 12px auto 32px; max-width: 560px; }

  .dl-btn {
    display: inline-block;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #0c130c;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 14px 40px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(76, 175, 80, 0.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(76, 175, 80, 0.5); }
  .dl-meta { margin-top: 14px; color: var(--muted); font-size: 0.95rem; }
  .dl-meta a { color: var(--accent); text-decoration: none; }
  .dl-meta a:hover { text-decoration: underline; }

  .badges { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 0.85rem;
  }

  section { padding: 48px 0; }
  section + section { border-top: 1px solid var(--border); }
  h2 { font-size: 1.5rem; margin-bottom: 20px; }
  h2 span { color: var(--accent); }

  .trees {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .tree {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tree b { display: block; color: var(--gold); margin-bottom: 2px; }
  .tree small { color: var(--muted); }

  ol.steps { padding-left: 22px; }
  ol.steps li { margin-bottom: 10px; }
  ol.steps a { color: var(--accent); }
  code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 7px;
    font-family: Consolas, monospace;
    font-size: 0.9em;
  }
  .hint { color: var(--muted); font-size: 0.95rem; margin-top: 16px; }
  .hint a { color: var(--accent); }

  /* ---------- The versions screen ---------- */
  #versions-view { min-height: 70vh; padding: 40px 0 56px; }
  .back-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .back-link:hover { text-decoration: underline; }

  #releases .release {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .release .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .release .head b { font-size: 1.15rem; color: var(--accent); }
  .release .head time { color: var(--muted); font-size: 0.9rem; }
  .release .head .latest {
    background: rgba(125, 216, 125, 0.15);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 10px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .release .head .get-btn {
    margin-left: auto;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #0c130c;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 7px 18px;
    border-radius: 8px;
    text-decoration: none;
    white-space: nowrap;
  }
  .release .head .get-btn:hover { filter: brightness(1.08); }
  .release .size { color: var(--muted); font-size: 0.85rem; }
  /* ---------- Patch notes ---------- */
  .notes {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
    text-align: left;
  }
  .notes .notes-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .notes .notes-head b { font-size: 1.2rem; color: var(--accent); }
  .notes .notes-head time { color: var(--muted); font-size: 0.9rem; }
  .notes .lead { color: var(--muted); margin: 10px 0 0; line-height: 1.6; }
  .notes h4 {
    margin: 22px 0 8px;
    font-size: 0.82rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes li { margin: 7px 0; line-height: 1.6; }
  .notes li b { color: var(--text); }
  .notes code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 0.9em;
  }
  .notes .empty { color: var(--muted); margin: 0; }
  .release .notes { margin-top: 14px; padding: 0 0 0 2px; border: 0; background: none; }
  .release .notes h4 { margin-top: 16px; }
  .release .notes-toggle {
    background: none;
    border: 0;
    color: var(--accent);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0;
    order: 99;
  }
  .release .notes-toggle:hover { text-decoration: underline; }

  #releases .empty { color: var(--muted); }
  #releases .empty a { color: var(--accent); }
  .load-more {
    display: block;
    margin: 20px auto 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    padding: 9px 26px;
    cursor: pointer;
  }
  .load-more:hover { border-color: var(--accent-dark); }

  .server {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .server .addr {
    font-family: Consolas, monospace;
    font-size: 1.1rem;
    color: var(--gold);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    user-select: all;
  }
  .server button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    font: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .server button:hover { border-color: var(--accent); color: var(--accent); }

  footer {
    border-top: 1px solid var(--border);
    padding: 28px 0 40px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div id="main-view">
<header>
  <div class="lang-picker" role="group" aria-label="Language">
    <button data-lang="en">EN</button>
    <button data-lang="pt">PT</button>
    <button data-lang="es">ES</button>
  </div>
  <a class="gh-btn" href="https://github.com/pedrolucasgb/PB-Enchantments-Mod" title="PB Enchantments on GitHub">

    Star
    <span id="gh-stars" class="gh-count" hidden>0</span>
  </a>
  <div class="wrap">
    <h1><span class="pb">PB</span> Enchantments</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <a id="download" class="dl-btn" href="https://github.com/pedrolucasgb/PB-Enchantments-Mod/releases/latest" data-i18n="download"></a>
    <p class="dl-meta" id="dl-meta"><a href="#versions" data-i18n="allVersions"></a></p>
    <div class="badges">

  </div>
</header>

<section>
  <div class="wrap">
    <h2 data-i18n-html="treesTitle"></h2>
    <div class="trees" id="trees"></div>
    <p class="hint" data-i18n-html="treesHint"></p>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-i18n-html="patchTitle"></h2>
    <div class="notes" id="patch-notes"><p class="empty" data-i18n="notesLoading"></p></div>
    <p class="hint"><a href="#versions" data-i18n="allVersions"></a></p>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-i18n-html="installTitle"></h2>
    <ol class="steps">
      <li data-i18n-html="step1"></li>
      <li data-i18n-html="step2"></li>
      <li data-i18n-html="step3"></li>
    </ol>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-i18n-html="serverTitle"></h2>
    <div class="server">
      <span class="addr" id="server-addr">jakarta-iraqi.tun.ply.gg</span>
      <button type="button" id="copy-addr" data-i18n="copyAddr"></button>
    </div>
    <p class="hint" data-i18n-html="serverHint"></p>
  </div>
</section>
</div>

<section id="versions-view" hidden>
  <div class="wrap">
    <a class="back-link" href="#" data-i18n="back"></a>
    <h2 data-i18n-html="versionsTitle"></h2>
    <div id="releases"><p class="empty" data-i18n="loading"></p></div>
    <button id="load-more" class="load-more" hidden data-i18n="loadMore"></button>
  </div>
</section>

<footer>
  <div class="wrap">
    Made by Pedro Bittencourt
  </div>
</footer>

(function () {
  const repo = "pedrolucasgb/PB-Enchantments-Mod";
  const PAGE_SIZE = 10;

  // ---------- Languages ----------
  const I18N = {

      empty: "No versions yet — check back soon.",

    },
    pt: {

      tagline: "Árvores de habilidades progressivas para cada ferramenta. Conquiste desafios, gaste XP, domine seu ofício.",
      download: "Baixar para Minecraft 26.2",
      allVersions: "Todas as versões",
      badgeApi: "Requer Fabric API",
      badgeSide: "Cliente e Servidor",
      treesTitle: 'Nove <span>árvores de habilidades</span>',
      trees: [
        ["Picareta", "Mineração em veio, fundição, pressa das profundezas"],
        ["Machado", "Derrubada de árvores, colheita, drops em dobro"],
        ["Terra", "Terra plana, ceifa em área, dedo verde"],

      treesHint: 'Cada árvore se abre com conquistas reais dentro do jogo — minere os minérios, derrube as árvores, acerte os tiros — e então gaste XP para desbloquear vantagens e gravar encantamentos exclusivos no seu equipamento. Aperte <code>K</code> no jogo para abrir as árvores, ou use <code>/pbenchants</code>.',

      badgeApi: "Requiere Fabric API",
      badgeSide: "Cliente y Servidor",
      treesTitle: 'Nueve <span>árboles de habilidades</span>',
      trees: [
        ["Pico", "Minado en veta, fundición, prisa de las profundidades"],

      step1: 'Instala el <a href="https://fabricmc.net/use/installer/">Fabric Loader</a> para Minecraft 26.2 (ejecuta el instalador, elige 26.2, listo).',

      serverTitle: 'Juega en el <span>servidor oficial</span>',
      serverHint: 'Añádelo en Multijugador &rarr; Añadir servidor con el mod instalado — la misma configuración de Minecraft 26.2 con Fabric de arriba. No hace falta puerto.',
      copyAddr: "Copiar dirección",
      copied: "¡Copiado!",
      versionsTitle: 'Todas las <span>versiones</span>',
      back: "← Volver",
      latest: "última",
      downloadShort: "Descargar",
      loadMore: "Cargar más",
      loading: "Cargando versiones…",
      empty: "Aún no hay versiones — vuelve pronto.",
      error: "No se pudo cargar la lista de versiones. Inténtalo de nuevo en un minuto."
    }
  };

  let lang = "en";
  try {
    lang = localStorage.getItem("pbe-lang")
      || (navigator.language || "en").toLowerCase().split("-")[0];
  } catch (e) { /* storage blocked: default by browser language below */
    lang = (navigator.language || "en").toLowerCase().split("-")[0];
  }
  if (!I18N[lang]) lang = "en";

  const t = key => I18N[lang][key];

  const copyBtn = document.getElementById("copy-addr");
  if (copyBtn) {
    copyBtn.addEventListener("click", () => {
      const text = document.getElementById("server-addr").textContent.trim();
      const done = () => {
        copyBtn.textContent = t("copied");
        setTimeout(() => { copyBtn.textContent = t("copyAddr"); }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => {});
      } else {
        const box = document.createElement("textarea");
        box.value = text;
        document.body.appendChild(box);
        box.select();
        try { document.execCommand("copy"); done(); } catch (e) { /* clipboard blocked */ }
        document.body.removeChild(box);
      }
    });
  }

  function applyLanguage() {
    document.documentElement.lang = I18N[lang].locale;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    const trees = document.getElementById("trees");
    trees.innerHTML = "";
    for (const [name, desc] of t("trees")) {
      const card = document.createElement("div");
      card.className = "tree";
      const b = document.createElement("b");
      b.textContent = name;
      const s = document.createElement("small");
      s.textContent = desc;
      card.appendChild(b);
      card.appendChild(s);
      trees.appendChild(card);
    }
    document.querySelectorAll(".lang-picker button").forEach(btn =>
      btn.classList.toggle("on", btn.dataset.lang === lang));
    renderReleases();
    updateMeta();
    renderLatestNotes();
  }

  document.querySelectorAll(".lang-picker button").forEach(btn =>
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      try { localStorage.setItem("pbe-lang", lang); } catch (e) { /* per-view only */ }
      applyLanguage();
    }));

  // ---------- The versions screen (hash-routed) ----------
  const mainView = document.getElementById("main-view");
  const versionsView = document.getElementById("versions-view");

  function applyRoute() {
    const showVersions = location.hash === "#versions";
    mainView.hidden = showVersions;
    versionsView.hidden = !showVersions;
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", applyRoute);

  // ---------- Releases: latest first, growing page by page ----------
  const releasesBox = document.getElementById("releases");
  const loadMoreBtn = document.getElementById("load-more");
  let releases = [];
  let nextPage = 1;
  let morePages = false;
  let failed = false;

  async function loadPage() {
    loadMoreBtn.disabled = true;
    try {
      const res = await fetch("https://api.github.com/repos/" + repo
        + "/releases?per_page=" + PAGE_SIZE + "&page=" + nextPage);
      if (!res.ok) throw new Error(res.status);
      const batch = (await res.json()).filter(r => !r.draft);
      releases = releases.concat(batch);
      morePages = batch.length === PAGE_SIZE;
      nextPage++;
      failed = false;
    } catch (e) {
      failed = true;
    }
    loadMoreBtn.disabled = false;
    renderReleases();
    updateMeta();
    renderLatestNotes();
  }
  loadMoreBtn.addEventListener("click", loadPage);

  // ---------- Patch notes ----------
  //
  // One file per released version, written in the repo at
  // docs/patchnotes/<version>.md and published alongside the jar on the
  // release. It carries all three languages in one file, under "## en",
  // "## pt" and "## es"; this reads the block for the language the reader
  // picked. The format and how to write one are in
  // .claude/skills/patch-notes/SKILL.md.
  //
  // Fetched from this site rather than from the release asset: the notes sit
  // in docs/, so on GitHub Pages the request is same-origin - no CORS, no API
  // rate limit, and it still works when the releases API is having a bad day.
  const NOTE_LANGS = ["en", "pt", "es"];
  const noteCache = new Map();

  function notesUrl(version) {
    return "patchnotes/" + encodeURIComponent(version) + ".md";
  }

  // "v0.7.1-beta" -> "0.7.1-beta"; the file is named after the mod version.
  function versionOf(release) {
    return String(release.tag_name || "").replace(/^v/, "");
  }

  async function loadNotes(version) {
    if (!noteCache.has(version)) {
      noteCache.set(version, (async () => {
        const res = await fetch(notesUrl(version), { cache: "no-cache" });
        // A version with no notes file 404s, and that is a normal answer for
        // anything released before 0.7.1-beta - not an error to report.
        if (res.status === 404) return null;
        if (!res.ok) throw new Error(res.status);
        const text = await res.text();
        // Pages serves index.html for unknown paths on some setups; a notes
        // file that is really HTML is a miss, not a document.
        if (/^\s*</.test(text)) return null;
        return parseNotes(text);
      })());
    }
    return noteCache.get(version);
  }

  /**
   * The whole format, and deliberately no more than this:
   *   # <title>                     the version heading (optional)
   *   <!-- released: YYYY-MM-DD --> the date (optional)
   *   ## en | ## pt | ## es         starts a language block
   *   ### <heading>                 a group inside the block
   *   - <text>                      a bullet; **bold** and `code` work
   *   <anything else>               a lead paragraph, before the first group
   * Returns { date, byLang: { en: {lead, groups:[{title, items}]}, ... } }.
   */
  function parseNotes(text) {
    const out = { date: "", byLang: {} };
    const dateMatch = text.match(/<!--\s*released:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})\s*-->/);
    if (dateMatch) out.date = dateMatch[1];

    let block = null;
    let group = null;
    let bullet = null;

    const flush = () => { bullet = null; };

    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("<!--")) { flush(); continue; }

      const langHead = line.match(/^##\s+([a-z]{2})\s*$/i);
      if (langHead && NOTE_LANGS.includes(langHead[1].toLowerCase())) {
        flush();
        group = null;
        block = { lead: "", groups: [] };
        out.byLang[langHead[1].toLowerCase()] = block;
        continue;
      }
      // Group headings are tested before the generic "#" skip, or "### Fixed"
      // would be swallowed as just another heading and every bullet would land
      // in one unlabelled list.
      const groupHead = line.match(/^###\s+(.*)$/);
      if (groupHead && block) {
        flush();
        group = { title: groupHead[1].trim(), items: [] };
        block.groups.push(group);
        continue;
      }
      if (line.startsWith("#")) { flush(); continue; }
      if (!block) continue;

      if (line.startsWith("- ")) {
        bullet = { text: line.slice(2).trim() };
        if (!group) {
          group = { title: "", items: [] };
          block.groups.push(group);
        }
        group.items.push(bullet);
        continue;
      }
      // A wrapped line continues whatever it is sitting under.
      if (bullet) bullet.text += " " + line;
      else if (!group) block.lead += (block.lead ? " " : "") + line;
    }
    return out;
  }

  // Markdown, to the extent the notes use it. Escaped first, so a stray
  // angle bracket in a version string can never become markup.
  function inline(md) {
    return escapeHtml(md)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }

  function renderNotes(box, notes, release, withHead) {
    box.innerHTML = "";
    const block = notes && (notes.byLang[lang] || notes.byLang.en);
    if (!block) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = t("notesNone");
      box.appendChild(p);
      return;
    }
    if (withHead) {
      const head = document.createElement("div");
      head.className = "notes-head";
      const name = document.createElement("b");
      name.textContent = release.name || release.tag_name;
      head.appendChild(name);
      const when = notes.date || (release.published_at || "").slice(0, 10);
      if (when) {
        const time = document.createElement("time");
        time.textContent = new Date(when + "T00:00:00")
          .toLocaleDateString(I18N[lang].locale, { year: "numeric", month: "long", day: "numeric" });
        head.appendChild(time);
      }
      box.appendChild(head);
    }
    if (block.lead) {
      const lead = document.createElement("p");
      lead.className = "lead";
      lead.innerHTML = inline(block.lead);
      box.appendChild(lead);
    }
    for (const group of block.groups) {
      if (group.title) {
        const h = document.createElement("h4");
        h.textContent = group.title;
        box.appendChild(h);
      }
      const ul = document.createElement("ul");
      for (const item of group.items) {
        const li = document.createElement("li");
        li.innerHTML = inline(item.text);
        ul.appendChild(li);
      }
      box.appendChild(ul);
    }
  }

  // The front-page section: always the newest release's notes.
  async function renderLatestNotes() {
    const box = document.getElementById("patch-notes");
    if (!box) return;
    if (!releases.length) {
      box.innerHTML = '<p class="empty">' + escapeHtml(t(failed ? "notesError" : "notesLoading")) + "</p>";
      return;
    }
    const latest = releases[0];
    try {
      renderNotes(box, await loadNotes(versionOf(latest)), latest, true);
    } catch (e) {
      box.innerHTML = '<p class="empty">' + escapeHtml(t("notesError")) + "</p>";
    }
  }

  // The jar a release actually ships. Every release carries exactly one, named
  // pbenchants-<version>.jar - the version is in the filename on purpose, so a
  // player can see at a glance which build is sitting in their mods folder.
  function jarAsset(r) {
    return (r.assets || []).find(a => /^pbenchants-.*\.jar$/.test(a.name)) || (r.assets || [])[0];
  }

  function updateMeta() {
    const meta = document.getElementById("dl-meta");
    const link = '<a href="#versions">' + t("allVersions") + "</a>";
    if (!releases.length) {
      meta.innerHTML = link;
      return;
    }
    const latest = releases[0];
    // The big button downloads the newest versioned jar. Until the API answers
    // it points at the releases page, which is the honest fallback: there is no
    // stable filename to link to, and there should not be one.
    const jar = jarAsset(latest);
    if (jar) {
      document.getElementById("download").href = jar.browser_download_url;
    }
    const when = new Date(latest.published_at)
      .toLocaleDateString(I18N[lang].locale, { year: "numeric", month: "short", day: "numeric" });
    meta.innerHTML = escapeHtml(latest.tag_name) + " · " + when + " · " + link;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderReleases() {
    if (failed && !releases.length) {
      releasesBox.innerHTML = '<p class="empty">' + t("error") + "</p>";
      loadMoreBtn.hidden = true;
      return;
    }
    if (!releases.length) {
      releasesBox.innerHTML = '<p class="empty">' + t(nextPage === 1 ? "loading" : "empty") + "</p>";
      loadMoreBtn.hidden = true;
      return;
    }
    releasesBox.innerHTML = "";
    for (const r of releases) {
      const jar = jarAsset(r);
      const div = document.createElement("div");
      div.className = "release";

      const head = document.createElement("div");
      head.className = "head";
      const name = document.createElement("b");
      name.textContent = r.name || r.tag_name;
      head.appendChild(name);
      if (r === releases[0] && nextPage > 1) {
        const tag = document.createElement("span");
        tag.className = "latest";
        tag.textContent = t("latest");
        head.appendChild(tag);
      }
      const time = document.createElement("time");
      time.textContent = new Date(r.published_at)
        .toLocaleDateString(I18N[lang].locale, { year: "numeric", month: "short", day: "numeric" });
      head.appendChild(time);
      if (jar) {
        const size = document.createElement("span");
        size.className = "size";
        size.textContent = Math.round(jar.size / 1024) + " KB";
        const get = document.createElement("a");
        get.className = "get-btn";
        get.href = jar.browser_download_url;
        get.textContent = "⤓ " + t("downloadShort");
        head.appendChild(get);
        head.appendChild(size);
      }
      div.appendChild(head);

      // Every release row can open its own notes, so "all versions" is also
      // the changelog archive. Fetched only when someone asks for it.
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "notes-toggle";
      toggle.textContent = t("notesShow");
      const notesBox = document.createElement("div");
      notesBox.className = "notes";
      notesBox.hidden = true;
      toggle.addEventListener("click", async () => {
        if (!notesBox.hidden) {
          notesBox.hidden = true;
          toggle.textContent = t("notesShow");
          return;
        }
        notesBox.hidden = false;
        toggle.textContent = t("notesHide");
        notesBox.innerHTML = '<p class="empty">' + escapeHtml(t("notesLoading")) + "</p>";
        try {
          renderNotes(notesBox, await loadNotes(versionOf(r)), r, false);
        } catch (e) {
          notesBox.innerHTML = '<p class="empty">' + escapeHtml(t("notesError")) + "</p>";
        }
      });
      head.appendChild(toggle);
      div.appendChild(notesBox);
      releasesBox.appendChild(div);
    }
    loadMoreBtn.hidden = !morePages;
  }

  // ---------- GitHub stars ----------
  (async function () {
    try {
      const info = await fetch("https://api.github.com/repos/" + repo);
      if (info.ok) {
        const stars = document.getElementById("gh-stars");
        stars.textContent = (await info.json()).stargazers_count;
        stars.hidden = false;
      }
    } catch (e) { /* the button works without the count */ }
  })();

  applyLanguage();
  applyRoute();
  loadPage();
})();
</script>

</body>
</html>
